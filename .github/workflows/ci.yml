name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Placeholder secrets for CI. `pnpm prisma generate` reads DATABASE_URL
    # from prisma.config.ts, and Better Auth requires BETTER_AUTH_SECRET when
    # its config module is evaluated (e.g. during a production build). Neither
    # value is used to connect anywhere in CI — they only satisfy validation.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/healsync_ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef0123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

  # E2E tests run against a locally started dev server (no external services).
  # Uncomment when the first e2e suite is ready for CI.
